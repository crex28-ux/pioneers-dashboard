<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pioneers Clubhouse — Baseball D3 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  /* Palette sampled directly from the real pioneers.be site (Roboto, the
     site's #110ECF nav/CTA blue, its #043350 border navy) and from the club
     crest artwork (#0B539F script blue, gold trim) — not an invented theme. */
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --border: #E1E5EC;
  --text: #10181F;
  --text-muted: #5B6472;
  --brand: #0B539F;
  --brand-light: #2E73BE;
  --brand-electric: #110ECF;
  --brand-navy: #06304F;
  --brand-wash: #EAF1FB;
  --gold: #C9A227;
  --gold-text: #8F721A;
  --gold-wash: #FBF3DC;
  --win: #1E8F5E;
  --win-wash: #E7F6EE;
  --loss: #C0392B;
  --loss-wash: #FBEAE8;
  --font-display: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  --font-body: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ---------- Header ---------- */
header.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(16,24,32,0.05);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.wordmark { display: flex; align-items: center; gap: 12px; }
.wordmark .logo-img { height: 40px; width: auto; display: block; }
.wordmark .name-block { display: flex; flex-direction: column; line-height: 1.1; }
.wordmark .name {
  font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
  font-size: 17px; color: var(--brand);
}
.wordmark .league {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600;
}
.header-scoreboard { display: flex; align-items: center; gap: 10px; }
.record-chip {
  background: var(--brand-navy); color: #fff;
  font-family: var(--font-mono); font-weight: 700; font-size: 17px;
  border-radius: 8px; padding: 7px 12px;
  letter-spacing: 0.03em;
}
.record-chip .lbl { font-family: var(--font-display); font-size: 9px; color: #9BB6D6; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 6px; }
.form-strip { display: flex; gap: 4px; }
.form-dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; font-family: var(--font-mono);
  color: #fff;
}
.form-dot.W { background: var(--win); }
.form-dot.L { background: var(--loss); }
.form-dot.T { background: var(--text-muted); }

/* ---------- Nav ---------- */
nav.tabs {
  display: flex; gap: 6px; padding: 12px 20px 0; background: var(--bg);
  position: sticky; top: 61px; z-index: 19;
}
nav.tabs button {
  border: 1px solid var(--border); background: var(--surface);
  padding: 8px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--text-muted); cursor: pointer;
}
nav.tabs button {
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
}
nav.tabs button.active {
  background: var(--brand); color: #fff; border-color: var(--brand);
  box-shadow: 0 3px 10px rgba(11,83,159,0.28);
}
nav.tabs button:hover:not(.active) { border-color: var(--brand-light); color: var(--brand); }

main { padding: 18px 20px 64px; max-width: 1100px; margin: 0 auto; }
.section-title {
  font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); margin: 22px 0 10px;
}
.section-title:first-child { margin-top: 4px; }

/* ---------- Leader rail ---------- */
.leader-rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.leader-card {
  flex: 0 0 auto; min-width: 132px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.leader-card:hover {
  border-color: var(--brand-light); transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(11,83,159,0.14);
}
.leader-card .lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gold-text); }
.leader-card .val { font-family: var(--font-mono); font-weight: 700; font-size: 20px; margin-top: 4px; color: var(--text); }
.leader-card .who { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ---------- Game cards ---------- */
.game-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.game-card:hover {
  border-color: var(--brand-light); transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(11,83,159,0.14);
}
.game-card .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
.game-card .badge {
  font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 10px; letter-spacing: 0.03em;
}
.badge.W { background: var(--win-wash); color: var(--win); }
.badge.L { background: var(--loss-wash); color: var(--loss); }
.badge.T { background: var(--bg); color: var(--text-muted); }
.game-card .row2 { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }
.matchup { font-weight: 700; font-size: 15px; }
.matchup .vs { color: var(--text-muted); font-weight: 500; margin: 0 6px; }
.score-chip {
  background: var(--brand-navy); color: #fff; font-family: var(--font-mono);
  font-weight: 700; font-size: 18px; border-radius: 8px; padding: 5px 12px;
  white-space: nowrap;
}
.game-card .row3 { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.linescore { display: none; margin-top: 10px; overflow-x: auto; }
.game-card.expanded .linescore { display: block; }
.linescore table { border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
.linescore td, .linescore th { padding: 3px 8px; text-align: center; border: 1px solid var(--border); }
.linescore th { color: var(--text-muted); font-weight: 600; }
.linescore td.team-lbl, .linescore th.team-lbl { text-align: left; font-family: var(--font-body); font-weight: 700; }

/* ---------- Roster ---------- */
.roster-controls { margin-bottom: 14px; }
.search-input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; background: var(--surface); color: var(--text);
}
.roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.player-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.player-card:hover {
  border-color: var(--brand-light); transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(11,83,159,0.14);
}
.jersey-badge {
  width: 42px; height: 42px; border-radius: 10px; background: var(--gold-wash);
  color: var(--brand); font-family: var(--font-mono); font-weight: 800; font-size: 16px;
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  border: 1px solid var(--gold);
  box-shadow: 0 2px 6px rgba(10,37,64,0.08);
}
.player-card .pname { font-weight: 700; font-size: 14px; line-height: 1.25; }
.player-card .pmeta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.player-card .pstat { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--brand); margin-top: 3px; }

/* ---------- Player detail ---------- */
.back-btn {
  border: none; background: none; color: var(--brand); font-weight: 700; font-size: 13px;
  cursor: pointer; padding: 0; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px;
}

.slashline { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
.slash-chip {
  background: var(--brand-navy); border-radius: 10px; padding: 10px 16px; min-width: 82px;
  text-align: center;
}
.slash-chip .lbl { font-size: 9px; color: #9BB6D6; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.slash-chip .val { font-family: var(--font-mono); color: #fff; font-weight: 700; font-size: 21px; margin-top: 3px; }

.subtabs { display: flex; gap: 6px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); }
.subtabs button {
  border: none; background: none; padding: 8px 4px; margin-right: 16px; font-size: 13px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.03em;
}
.subtabs button.active { color: var(--brand); border-bottom-color: var(--gold); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin: 14px 0; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px; text-align: center; }
.stat-box .n { font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.stat-box .l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

table.log-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
table.log-table th, table.log-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: center; }
table.log-table th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; }
table.log-table td:first-child, table.log-table th:first-child,
table.log-table td:nth-child(2), table.log-table th:nth-child(2) { text-align: left; }
table.log-table tbody tr:hover { background: var(--brand-wash); }

.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
}
.chart-card h4 { margin: 0 0 12px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
.chart-wrap { position: relative; height: 220px; }

.advanced-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.adv-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
}
.adv-card .name { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--brand); }
.adv-card .num { font-family: var(--font-mono); font-weight: 700; font-size: 24px; margin: 4px 0; }
.adv-card .desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

/* ---------- Team trends & comparison ---------- */
.compare-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px;
  box-shadow: 0 1px 2px rgba(16,24,32,0.04), 0 1px 3px rgba(16,24,32,0.03);
}
.compare-controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
.stat-picker label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
.stat-picker select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text);
}
.player-checklist { display: flex; gap: 8px; flex-wrap: wrap; }
.player-check {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 16px;
  border: 1px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none;
  color: var(--text-muted); background: var(--bg);
}
.player-check.on { background: var(--brand-wash); border-color: var(--brand-light); color: var(--brand); }
.player-check .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }

.empty-note { color: var(--text-muted); font-size: 13px; padding: 20px 0; }
.role-pill {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 8px; background: var(--brand-wash); color: var(--brand); margin-top: 4px;
}
.role-pill.on-dark { background: rgba(255,255,255,0.16); color: #fff; }

/* ---------- Player photos ---------- */
.player-photo-thumb {
  width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex: 0 0 auto;
  border: 2px solid var(--brand); background: var(--brand-navy);
  box-shadow: 0 2px 6px rgba(10,37,64,0.18);
}
.player-photo-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }

/* Player detail hero: a proper photo-card, not a panoramic banner -- a tall
   portrait photo gets a tall frame, sized to actually show the player. */
.player-hero {
  display: flex; align-items: stretch; height: 208px; border-radius: 18px; overflow: hidden;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--brand-navy) 0%, #0A4A78 60%, var(--brand) 100%);
  box-shadow: 0 10px 28px rgba(6,48,79,0.22);
}
.hero-photo-frame {
  width: 168px; flex: 0 0 168px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, var(--brand-navy), var(--brand));
}
.hero-photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; display: block; }
.hero-photo-frame .hero-fallback-number {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-weight: 800; font-size: 54px; color: rgba(255,255,255,0.92);
}
.hero-info {
  flex: 1; position: relative; padding: 0 26px; display: flex; flex-direction: column;
  justify-content: center; overflow: hidden; min-width: 0;
}
.hero-info .hero-number-bg {
  position: absolute; right: -8px; bottom: -38px; font-family: var(--font-mono); font-weight: 800;
  font-size: 158px; line-height: 1; color: rgba(255,255,255,0.09); user-select: none; pointer-events: none;
}
.hero-info .hero-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
  position: relative; z-index: 1;
}
.hero-info .hero-name {
  font-size: 25px; font-weight: 800; color: #fff; margin-top: 3px; position: relative; z-index: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hero-info .hero-meta { font-size: 13px; color: #BFD6EE; margin-top: 4px; position: relative; z-index: 1; }
.hero-info .hero-pills { margin-top: 12px; position: relative; z-index: 1; display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 560px) {
  .player-hero { flex-direction: column; height: auto; }
  .hero-photo-frame { width: 100%; height: 150px; }
  .hero-info { padding: 16px 20px 20px; }
  .hero-number-bg { font-size: 110px; bottom: -24px; }
  .slashline { justify-content: space-between; }
  .slash-chip { flex: 1 1 40%; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wordmark">
    <img class="logo-img" id="header-logo" alt="Hoboken Pioneers logo">
    <div class="name-block">
      <span class="name">Pioneers Clubhouse</span>
      <span class="league">Hoboken · Baseball D3 · 2026</span>
    </div>
  </div>
  <div class="header-scoreboard">
    <div class="form-strip" id="form-strip"></div>
    <div class="record-chip"><span class="lbl">Record</span><span id="record-text">–</span></div>
  </div>
</header>

<nav class="tabs">
  <button data-view="team" class="active">Team</button>
  <button data-view="hitting">Hitting</button>
  <button data-view="pitching">Pitching</button>
  <button data-view="roster">Roster</button>
</nav>

<main id="main"></main>

const state = { view: 'team', playerId: null, playerTab: 'overview' };
let activeCharts = [];

function destroyCharts() {
  activeCharts.forEach(c => c.destroy());
  activeCharts = [];
}

function playerById(pid) {
  return DATA.players.find(p => p.player_id === pid);
}
function pname(p) { return `${p.firstname} ${p.lastname}`; }
function fmt3(v) {
  if (v === null || v === undefined) return '—';
  return (v < 0 ? '-' : '') + Math.abs(v).toFixed(3).replace(/^-?0\./, m => m);
}
function fmtAvg(v) {
  if (v === null || v === undefined) return '.000';
  let s = v.toFixed(3);
  return s.startsWith('0') ? s.slice(1) : s;
}
function photoFor(playerId) {
  return PLAYER_PHOTOS[playerId] || null;
}

/* ---------- Header ---------- */
function renderHeader() {
  document.getElementById('record-text').textContent = `${DATA.team.wins}-${DATA.team.losses}`;
  const strip = document.getElementById('form-strip');
  strip.innerHTML = DATA.team.last5.map(r => `<div class="form-dot ${r}">${r}</div>`).join('');
  const logoEl = document.getElementById('header-logo');
  if (logoEl && LOGO_DATA_URI) logoEl.src = LOGO_DATA_URI;
}

/* ---------- Team view ---------- */
const LEADER_META = {
  avg: { label: 'AVG Leader', fmt: v => fmtAvg(v) },
  ops: { label: 'OPS Leader', fmt: v => v.toFixed(3) },
  hr: { label: 'HR Leader', fmt: v => String(v) },
  rbi: { label: 'RBI Leader', fmt: v => String(v) },
  sb: { label: 'SB Leader', fmt: v => String(v) },
  era: { label: 'ERA Leader', fmt: v => v.toFixed(2) },
  so_pitch: { label: 'K Leader', fmt: v => String(v) },
};

function renderTeamView() {
  const leaderCards = Object.keys(LEADER_META).map(key => {
    const meta = LEADER_META[key];
    const top = DATA.leaders[key] && DATA.leaders[key][0];
    if (!top) return '';
    return `<div class="leader-card" data-player="${top.player_id}">
      <div class="lbl">${meta.label}</div>
      <div class="val">${meta.fmt(top.value)}</div>
      <div class="who">${top.name}</div>
    </div>`;
  }).join('');

  const gamesReversed = [...DATA.games].reverse();
  const gameCards = gamesReversed.map(g => {
    const maxInn = Math.max(g.line_hob.length, g.line_opp.length);
    let innHeaders = '';
    for (let i = 0; i < maxInn; i++) innHeaders += `<th>${i+1}</th>`;
    const hobRow = g.line_hob.map(v => `<td>${v}</td>`).join('');
    const oppRow = g.line_opp.map(v => `<td>${v}</td>`).join('');
    return `<div class="game-card" data-game="${g.game_id}">
      <div class="row1">
        <span>${g.date} · ${g.home_away}</span>
        <span class="badge ${g.result}">${g.result === 'W' ? 'WIN' : g.result === 'L' ? 'LOSS' : 'TIE'}</span>
      </div>
      <div class="row2">
        <div class="matchup">Pioneers<span class="vs">vs</span>${g.opponent}</div>
        <div class="score-chip">${g.hob_runs} – ${g.opp_runs}</div>
      </div>
      <div class="row3">
        <span>${g.location}</span>
        <span>H: ${g.hob_hits}-${g.opp_hits} &nbsp; E: ${g.hob_errors}-${g.opp_errors}</span>
      </div>
      <div class="linescore">
        <table>
          <thead><tr><th class="team-lbl">Team</th>${innHeaders}<th>R</th></tr></thead>
          <tbody>
            <tr><td class="team-lbl">Pioneers</td>${hobRow}<td><strong>${g.hob_runs}</strong></td></tr>
            <tr><td class="team-lbl">${g.opponent}</td>${oppRow}<td><strong>${g.opp_runs}</strong></td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="section-title">Stat Leaders</div>
    <div class="leader-rail">${leaderCards}</div>
    <div class="section-title">Schedule &amp; Results</div>
    ${gameCards}
  `;

  document.querySelectorAll('.leader-card').forEach(el => {
    el.addEventListener('click', () => openPlayer(el.dataset.player));
  });
  document.querySelectorAll('.game-card').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });
}

/* ---------- Roster view ---------- */
function renderRosterView(filterText) {
  const filter = (filterText || '').trim().toLowerCase();
  const players = DATA.players.filter(p => !filter || pname(p).toLowerCase().includes(filter));

  const cards = players.map(p => {
    const headline = p.batting
      ? `${fmtAvg(p.batting.season.avg)} AVG`
      : (p.pitching ? `${p.pitching.season.era.toFixed(2)} ERA` : '—');
    const posLabel = p.primary_position || (p.pitching ? 'P' : '');
    const photo = photoFor(p.player_id);
    const avatar = photo
      ? `<div class="player-photo-thumb"><img src="${photo.thumb}" alt="${pname(p)}"></div>`
      : `<div class="jersey-badge">${p.uniform || '–'}</div>`;
    return `<div class="player-card" data-player="${p.player_id}">
      ${avatar}
      <div>
        <div class="pname">${pname(p)}</div>
        <div class="pmeta">${posLabel}${p.role === 'both' ? ' · Two-Way' : ''}</div>
        <div class="pstat">${headline}</div>
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">No players match “${filterText}”.</div>`;

  document.getElementById('main').innerHTML = `
    <div class="roster-controls">
      <input class="search-input" id="roster-search" placeholder="Search roster by name…" value="${filterText || ''}">
    </div>
    <div class="roster-grid">${cards}</div>
  `;

  document.getElementById('roster-search').addEventListener('input', e => renderRosterView(e.target.value));
  document.querySelectorAll('.player-card').forEach(el => {
    el.addEventListener('click', () => openPlayer(el.dataset.player));
  });
}

/* ---------- Player detail view ---------- */
function openPlayer(pid) {
  state.view = 'player'; state.playerId = pid; state.playerTab = 'overview';
  render();
}

function playerHeroHtml(p) {
  const photo = photoFor(p.player_id);
  const posLabel = p.positions.join(' / ') || (p.pitching ? 'P' : '');
  const numberDigits = (p.uniform || '').toString() || '–';
  const photoFrame = photo
    ? `<img src="${photo.hero}" alt="${pname(p)}">`
    : `<div class="hero-fallback-number">${numberDigits}</div>`;
  return `
    <div class="player-hero">
      <div class="hero-photo-frame">${photoFrame}</div>
      <div class="hero-info">
        <div class="hero-number-bg">${numberDigits}</div>
        <div class="hero-eyebrow">${DATA.team.name}</div>
        <div class="hero-name">${pname(p)}</div>
        <div class="hero-meta">${posLabel}</div>
        <div class="hero-pills">
          <span class="role-pill on-dark">#${numberDigits}</span>
          ${p.role === 'both' ? '<span class="role-pill on-dark">Two-Way Player</span>' : ''}
        </div>
      </div>
    </div>`;
}

function renderPlayerView() {
  destroyCharts();
  const p = playerById(state.playerId);
  if (!p) { document.getElementById('main').innerHTML = `<div class="empty-note">Player not found.</div>`; return; }

  const tabs = ['overview', 'gamelog', 'trends', 'advanced'];
  const tabLabels = { overview: 'Overview', gamelog: 'Game Log', trends: 'Trends', advanced: 'Advanced' };

  document.getElementById('main').innerHTML = `
    <button class="back-btn" id="back-btn">&larr; Back to Roster</button>
    ${playerHeroHtml(p)}
    <div class="subtabs">
      ${tabs.map(t => `<button data-tab="${t}" class="${state.playerTab === t ? 'active' : ''}">${tabLabels[t]}</button>`).join('')}
    </div>
    <div id="player-tab-content"></div>
  `;

  document.getElementById('back-btn').addEventListener('click', () => { state.view = 'roster'; render(); });
  document.querySelectorAll('.subtabs button').forEach(btn => {
    btn.addEventListener('click', () => { state.playerTab = btn.dataset.tab; renderPlayerView(); });
  });

  const content = document.getElementById('player-tab-content');
  if (state.playerTab === 'overview') content.innerHTML = playerOverviewHtml(p);
  else if (state.playerTab === 'gamelog') content.innerHTML = playerGameLogHtml(p);
  else if (state.playerTab === 'trends') { content.innerHTML = playerTrendsHtml(p); mountTrendCharts(p); }
  else if (state.playerTab === 'advanced') content.innerHTML = playerAdvancedHtml(p);
}

function playerOverviewHtml(p) {
  let html = '';
  if (p.batting) {
    const s = p.batting.season;
    html += `
      <div class="slashline">
        <div class="slash-chip"><div class="lbl">AVG</div><div class="val">${fmtAvg(s.avg)}</div></div>
        <div class="slash-chip"><div class="lbl">OBP</div><div class="val">${fmtAvg(s.obp)}</div></div>
        <div class="slash-chip"><div class="lbl">SLG</div><div class="val">${fmtAvg(s.slg)}</div></div>
        <div class="slash-chip"><div class="lbl">OPS</div><div class="val">${s.ops.toFixed(3)}</div></div>
      </div>
      <div class="stat-grid">
        ${statBox(s.games,'G')}${statBox(s.pa,'PA')}${statBox(s.ab,'AB')}${statBox(s.r,'R')}${statBox(s.h,'H')}
        ${statBox(s.double,'2B')}${statBox(s.triple,'3B')}${statBox(s.hr,'HR')}${statBox(s.rbi,'RBI')}
        ${statBox(s.bb,'BB')}${statBox(s.so,'SO')}${statBox(s.sb,'SB')}${statBox(s.cs,'CS')}
      </div>`;
  }
  if (p.pitching) {
    const s = p.pitching.season;
    html += `
      <div class="section-title">Pitching</div>
      <div class="slashline">
        <div class="slash-chip"><div class="lbl">ERA</div><div class="val">${s.era.toFixed(2)}</div></div>
        <div class="slash-chip"><div class="lbl">WHIP</div><div class="val">${s.whip.toFixed(2)}</div></div>
        <div class="slash-chip"><div class="lbl">W-L</div><div class="val">${s.win}-${s.loss}</div></div>
        <div class="slash-chip"><div class="lbl">SO</div><div class="val">${s.so}</div></div>
      </div>
      <div class="stat-grid">
        ${statBox(s.games,'G')}${statBox(s.ip.toFixed(1),'IP')}${statBox(s.h,'H')}${statBox(s.r,'R')}
        ${statBox(s.er,'ER')}${statBox(s.bb,'BB')}${statBox(s.so,'SO')}${statBox(s.hr,'HR')}${statBox(s.pitches,'PITCHES')}
      </div>`;

function mountTrendCharts(p) {
  const boardOrange = '#C9A227';

  const loss = '#C0392B';
  const gridColor = '#E1E5EC';

  if (p.batting && p.batting.games.length > 1) {
    const games = p.batting.games;
    const labels = games.map(g => g.date.slice(5));
    const abCanvas = document.getElementById('chart-bat-ab');
    if (abCanvas) {
      activeCharts.push(new Chart(abCanvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'AB', data: games.map(g => g.ab), backgroundColor: gridColor },
            { label: 'H', data: games.map(g => g.h), backgroundColor: brand },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          plugins: { legend: { position: 'bottom' } },
        }
      }));
    }

    let ab = 0, h = 0, obpNum = 0, obpDen = 0, tb = 0;
    const avgSeries = [], obpSeries = [], slgSeries = [];
    games.forEach(g => {
      ab += g.ab; h += g.h;
      obpNum += (g.h + g.bb + g.hbp); obpDen += (g.ab + g.bb + g.hbp + g.sf);
      const singles = g.h - g.double - g.triple - g.hr;
      tb += singles + 2*g.double + 3*g.triple + 4*g.hr;
      avgSeries.push(ab ? h/ab : 0);
      obpSeries.push(obpDen ? obpNum/obpDen : 0);
      slgSeries.push(ab ? tb/ab : 0);
    });
    const rateCanvas = document.getElementById('chart-bat-rate');
    if (rateCanvas) {
      activeCharts.push(new Chart(rateCanvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'AVG', data: avgSeries, borderColor: brand, backgroundColor: 'transparent', tension: 0.25 },
            { label: 'OBP', data: obpSeries, borderColor: boardOrange, backgroundColor: 'transparent', tension: 0.25 },
            { label: 'SLG', data: slgSeries, borderColor: loss, backgroundColor: 'transparent', tension: 0.25 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { position: 'bottom' } },
        }
      }));
    }
  }

  if (p.pitching && p.pitching.games.length > 1) {
    const games = p.pitching.games;
    const labels = games.map(g => g.date.slice(5));
    const ipCanvas = document.getElementById('chart-pit-ip');
    if (ipCanvas) {
      activeCharts.push(new Chart(ipCanvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'IP', data: games.map(g => g.ip), backgroundColor: brand },
            { label: 'ER', data: games.map(g => g.er), backgroundColor: loss },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { position: 'bottom' } },
        }
      }));
    }

    let outs = 0, er = 0;
    const eraSeries = [];
    games.forEach(g => {
      outs += g.outs; er += g.er;
      const ip = outs / 3;
      eraSeries.push(ip ? (er*9)/ip : 0);
    });
    const eraCanvas = document.getElementById('chart-pit-era');
    if (eraCanvas) {
      activeCharts.push(new Chart(eraCanvas, {
        type: 'line',
        data: { labels, datasets: [{ label: 'ERA', data: eraSeries, borderColor: boardOrange, backgroundColor: 'transparent', tension: 0.25 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { display: false } },
        }
      }));
    }
  }
}

function playerAdvancedHtml(p) {
  let html = '<div class="advanced-grid">';

    html += advCard('wOBA', s.woba.toFixed(3), 'Weighted on-base average — blends every outcome (BB, 1B, 2B, 3B, HR) by its real run value. Uses standard MLB-scale weights as an approximation.');
    html += advCard('BB% / K%', `${(s.bb_pct*100).toFixed(1)}% / ${(s.k_pct*100).toFixed(1)}%`, 'Walk rate vs. strikeout rate per plate appearance — a quick read on plate discipline.');

/* ---------- Shared chart helper ---------- */
const COMPARE_PALETTE = ['#0B539F', '#C9A227', '#C0392B', '#110ECF', '#2E9E7C', '#8A5AA8', '#2E73BE', '#B8722E', '#5B7FA6', '#6B8F3F'];

function padSeries(arr, len) {
  const out = arr.slice();
  while (out.length < len) out.push(null);
  return out;
}

function addChart(canvasId, type, labels, datasets, yOverrides) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  activeCharts.push(new Chart(canvas, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: Object.assign({ beginAtZero: true }, yOverrides && yOverrides.y) },
      plugins: { legend: { position: 'bottom' } },
    }
  }));
}

/* ---------- Hitting view ---------- */
function cumulativeBattingSeries(games) {
  let ab = 0, h = 0, obpNum = 0, obpDen = 0, tb = 0, bb = 0, so = 0, pa = 0;
  const out = { avg: [], obp: [], slg: [], ops: [], bbPct: [], kPct: [] };
  games.forEach(g => {
    ab += g.ab; h += g.h; bb += g.bb; so += g.so; pa += g.pa;
    obpNum += (g.h + g.bb + g.hbp); obpDen += (g.ab + g.bb + g.hbp + g.sf);
    const singles = g.h - g.double - g.triple - g.hr;
    tb += singles + 2 * g.double + 3 * g.triple + 4 * g.hr;
    const avg = ab ? h / ab : 0, obp = obpDen ? obpNum / obpDen : 0, slg = ab ? tb / ab : 0;
    out.avg.push(avg); out.obp.push(obp); out.slg.push(slg); out.ops.push(obp + slg);
    out.bbPct.push(pa ? bb / pa : 0); out.kPct.push(pa ? so / pa : 0);
  });
  return out;
}

    };
  });
  const canvas = document.getElementById('chart-pitching-compare');
  if (!canvas) return;
  activeCharts.push(new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true } },
      plugins: { legend: { position: 'bottom' } },
    }
  }));
}

/* ---------- Router ---------- */
function render() {
  destroyCharts();
  document.querySelectorAll('nav.tabs button').forEach(b => {
    const activeView = state.view === 'player' ? 'roster' : state.view;
    b.classList.toggle('active', b.dataset.view === activeView);
  });
  if (state.view === 'team') renderTeamView();
  else if (state.view === 'hitting') renderHittingView();
  else if (state.view === 'pitching') renderPitchingView();
  else if (state.view === 'roster') renderRosterView('');
  else if (state.view === 'player') renderPlayerView();
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); });
});

renderHeader();
render();
</script>
</body>
</html>
